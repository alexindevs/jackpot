<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jackpot dev harness</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/base.css">
<style>
  header { margin-bottom: 12px; }
  #seats { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:12px; }
  .seat { background:var(--card); border-radius:10px; padding:10px; }
  .seat h3 { margin:0 0 6px; font-size:15px; }
  .seat section { margin:6px 0; }
  pre.log { height:110px; overflow:auto; margin:4px 0; font-size:11px; color:var(--mute); background:#0b0d11; padding:6px; border-radius:6px; white-space:pre-wrap; word-break:break-all; }
  .raw { width:100%; height:44px; font:11px monospace; }
</style>
</head>
<body>
<header>
  <h2 style="margin:0 0 6px">jackpot dev harness</h2>
  <div class="row">
    <label>Server <input id="server" size="34"></label>
    <label>Players <input id="count" type="number" min="2" max="10" value="4" style="width:56px"></label>
    <button id="connect">Connect all</button>
    <button id="scenario">Scenario: room, pairs, start, ready</button>
    <button id="disconnect" class="alt">Disconnect all</button>
    <button id="restart" class="alt">Restart test</button>
    <label><input id="autoproc" type="checkbox"> auto-proclaim for partners (test helper)</label>
    <span id="top" class="mute"></span>
  </div>
  <p class="mute" style="margin:6px 0 0">Signs in as dev:p1, dev:p2, … (dev-mode servers only). One tab drives every seat.</p>
  <section id="rt" style="margin-top:10px">
    <div class="prompt"><b>Restart test.</b> Start the server with <code>DATABASE_URL</code> set (Postgres), otherwise nothing is saved and nothing can come back. Stop it and start it again when the test says so.</div>
    <pre id="rt-log" style="margin:6px 0 0; font-size:12px; white-space:pre-wrap"></pre>
  </section>
</header>
<div id="seats"></div>
<script type="module" src="./harness.js"></script>
</body>
</html>
